## Read by copacabana's matrix.yml: the AMD jobs in Release. Two files for one platform because the documentation
## examples are built and run in Debug only, and a file carries one target list.
runs-on: amd
configs: [Release]
build-targets: unit.exe
test-targets: unit
rows:
  - { preset: "clang-hip", setup: "./.github/scripts/rocm.sh" }
