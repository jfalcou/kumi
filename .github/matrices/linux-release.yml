## Read by copacabana's matrix.yml: the linux jobs in Release. Two files for one platform because the documentation
## examples are built and run in Debug only, and a file carries one target list.
runs-on: ubuntu-latest
configs: [Release]
build-targets: unit.exe
test-targets: ^unit\.
rows:
  - { name: "gcc"           , preset: "gcc"           , image: "v11" }
  - { name: "clang"         , preset: "clang"         , image: "v11" }
  - { name: "clang libc++"  , preset: "clang-libc++"  , image: "v11" }
  - { name: "gcc16"         , preset: "gcc"           , image: "v11"    , setup: "./.github/scripts/g++-16.sh"  }
  - { name: "icpx"          , preset: "icpx"          , image: "sycl-v1", setup: "/opt/intel/oneapi/setvars.sh" }
  - { name: "wasm"          , preset: "wasm"          , image: "v11"    , wrapper: "emcmake" }
