## Read by copacabana's matrix.yml: the AMD jobs in Debug. Two files for one platform because the documentation
## examples are built and run in Debug only, and a file carries one target list.
runs-on: amd
configs: [Debug]
build-targets: unit.exe doc.exe
test-targets: unit|doc
rows:
  - { preset: "clang-hip", setup: "./.github/scripts/rocm.sh" }
