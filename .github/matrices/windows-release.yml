## Read by copacabana's matrix.yml: the windows jobs in Release. Two files for one platform because the documentation
## examples are built and run in Debug only, and a file carries one target list.
runs-on: windows-2022
configs: [Release]
build-targets: unit.exe
test-targets: unit
rows:
  - { name: "MSVC"    , preset: "msvc"    }
  - { name: "Clang-CL", preset: "clangcl" }
