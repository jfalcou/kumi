name: Unit Tests
on:
  ## Main gets the matrix once a night rather than on every merge: a run of its own queued behind each merge held
  ## the pull requests back. 03:00 UTC.
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    branches:
      - main

concurrency:
  group: kumi-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ##################################################################################################
  ## A nightly run of main is expendable: a pull request needs the runners more, and the next night
  ## measures main again. Fire and forget, so nothing here can hold the matrix back.
  ##################################################################################################
  yield-to-pull-requests:
    name: Yield
    runs-on: [self-hosted, avx512]
    continue-on-error: true
    permissions:
      actions: write
    steps:
      ## The condition sits on the step, not on the job: everything below waits for this job, and a job skipped by its
      ## own condition skips whatever needs it, which would leave the nightly run of main with nothing to do.
      - name: Cancel what main has in flight
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              per_page: 20
            });

            for (const run of runs.data.workflow_runs)
            {
              if (run.status === 'queued' || run.status === 'in_progress')
              {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
              }
            }

  ##################################################################################################
  ## Fast gate: pre-commit checks, standalone generation and sanitizers all start together with no
  ## interdependency - only once all three pass does the (much heavier) compiler matrix start below.
  ##################################################################################################
  precommit:
    name: Meta Checks
    needs: [yield-to-pull-requests]
    uses: jfalcou/copacabana/.github/workflows/precommit.yml@44053e713b1b57329ccbcbb8878c839024bf19ee # v8

  ##======================================================================================================================
  ## Ensure Standalone is viable
  ##======================================================================================================================
  standalone-generation:
    name: Standalone Generation
    needs: [yield-to-pull-requests]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jfalcou/compilers:v10
    steps:
      - name: Fetch current branch
        uses: actions/checkout@v7

      - name: Generate standalone header
        run: |
          cmake -S . -B build -G Ninja -DKUMI_BUILD_TEST=OFF -DKUMI_BUILD_DOCUMENTATION=OFF
          cmake --build build --target kumi-standalone

      - name: Test standalone header
        run: |
          cd build
          g++ -std=c++20 -S -I. ../test/integration/main.cpp -DKUMI_STANDALONE

  ##################################################################################################
  ## Sanitizers (ASan+UBSan)
  ##################################################################################################
  sanitizer-tests:
    name: Sanitizers
    needs: [yield-to-pull-requests]
    uses: jfalcou/copacabana/.github/workflows/sanitizers.yml@44053e713b1b57329ccbcbb8878c839024bf19ee # v8
    with:
      build-targets: unit.exe doc.exe
      test-targets: unit|doc

  ##################################################################################################
  ## Coverage report - informational, runs alongside the gate without blocking the matrix
  ##################################################################################################
  coverage-report:
    name: Coverage
    needs: [yield-to-pull-requests]
    uses: jfalcou/copacabana/.github/workflows/coverage.yml@44053e713b1b57329ccbcbb8878c839024bf19ee # v8
    with:
      project: kumi
      build-targets: kumi-test

  ##################################################################################################
  ## Unit Tests - the full compiler matrix, gated behind the fast checks above all passing
  ##################################################################################################
  linux-debug-tests:
    name: Linux
    needs: [precommit, standalone-generation, sanitizer-tests]
    uses: jfalcou/copacabana/.github/workflows/matrix.yml@44053e713b1b57329ccbcbb8878c839024bf19ee # v8
    with:
      file: .github/matrices/linux-debug.yml

  linux-release-tests:
    name: Linux
    needs: [precommit, standalone-generation, sanitizer-tests]
    uses: jfalcou/copacabana/.github/workflows/matrix.yml@44053e713b1b57329ccbcbb8878c839024bf19ee # v8
    with:
      file: .github/matrices/linux-release.yml

  macos-debug-tests:
    name: MacOS
    needs: [precommit, standalone-generation, sanitizer-tests]
    uses: jfalcou/copacabana/.github/workflows/matrix.yml@44053e713b1b57329ccbcbb8878c839024bf19ee # v8
    with:
      file: .github/matrices/macos-debug.yml

  macos-release-tests:
    name: MacOS
    needs: [precommit, standalone-generation, sanitizer-tests]
    uses: jfalcou/copacabana/.github/workflows/matrix.yml@44053e713b1b57329ccbcbb8878c839024bf19ee # v8
    with:
      file: .github/matrices/macos-release.yml

  windows-debug-tests:
    name: Windows
    needs: [precommit, standalone-generation, sanitizer-tests]
    uses: jfalcou/copacabana/.github/workflows/matrix.yml@44053e713b1b57329ccbcbb8878c839024bf19ee # v8
    with:
      file: .github/matrices/windows-debug.yml

  windows-release-tests:
    name: Windows
    needs: [precommit, standalone-generation, sanitizer-tests]
    uses: jfalcou/copacabana/.github/workflows/matrix.yml@44053e713b1b57329ccbcbb8878c839024bf19ee # v8
    with:
      file: .github/matrices/windows-release.yml

  nvidia-debug-tests:
    name: Nvidia
    needs: [precommit, standalone-generation, sanitizer-tests]
    uses: jfalcou/copacabana/.github/workflows/matrix.yml@44053e713b1b57329ccbcbb8878c839024bf19ee # v8
    with:
      file: .github/matrices/nvidia-debug.yml

  nvidia-release-tests:
    name: Nvidia
    needs: [precommit, standalone-generation, sanitizer-tests]
    uses: jfalcou/copacabana/.github/workflows/matrix.yml@44053e713b1b57329ccbcbb8878c839024bf19ee # v8
    with:
      file: .github/matrices/nvidia-release.yml

  ##################################################################################################
  ## Device tests - kumi inside real kernels, on the card the self-hosted runner carries
  ##################################################################################################
  nvidia-device-tests:
    name: Device
    needs: [precommit, standalone-generation, sanitizer-tests]
    uses: jfalcou/copacabana/.github/workflows/matrix.yml@44053e713b1b57329ccbcbb8878c839024bf19ee # v8
    with:
      file: .github/matrices/nvidia-device.yml
