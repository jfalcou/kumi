name: Unit Tests
on:
  pull_request:
    branches:
      - main

concurrency:
  group: kumi-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ##################################################################################################
  ## Fast gate: pre-commit checks, standalone generation and sanitizers all start together with no
  ## interdependency - only once all three pass does the (much heavier) compiler matrix start below.
  ##################################################################################################
  precommit:
    name: Meta Checks
    uses: jfalcou/copacabana/.github/workflows/precommit.yml@468da45ac73a026a4bca4510840ebe635aa66c2c # v6

  ##======================================================================================================================
  ## Ensure Standalone is viable
  ##======================================================================================================================
  standalone-generation:
    name: Standalone Generation
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jfalcou/compilers:v10
    steps:
      - name: Fetch current branch
        uses: actions/checkout@v7

      - name: Generate standalone header
        run: |
          cmake -S . -B build -G Ninja -DKUMI_BUILD_TEST=OFF -DKUMI_BUILD_DOCUMENTATION=OFF
          cmake --build build --target kumi-standalone

      - name: Test standalone header
        run: |
          cd build
          g++ -std=c++20 -S -I. ../test/integration/main.cpp -DKUMI_STANDALONE

  ##################################################################################################
  ## Sanitizers (ASan+UBSan)
  ##################################################################################################
  sanitizer-tests:
    name: Sanitizers
    uses: jfalcou/copacabana/.github/workflows/sanitizers.yml@468da45ac73a026a4bca4510840ebe635aa66c2c # v6
    with:
      build-targets: unit.exe doc.exe
      test-targets: unit|doc

  ##################################################################################################
  ## Coverage report - informational, runs alongside the gate without blocking the matrix
  ##################################################################################################
  coverage-report:
    name: Coverage
    uses: jfalcou/copacabana/.github/workflows/coverage.yml@468da45ac73a026a4bca4510840ebe635aa66c2c # v6
    with:
      project: kumi
      build-targets: kumi-test

  ##################################################################################################
  ## Unit Tests - the full compiler matrix, gated behind the fast checks above all passing
  ##################################################################################################
  linux-tests:
    name: Linux
    needs: [precommit, standalone-generation, sanitizer-tests]
    uses: ./.github/workflows/linux.yml

  macos-tests:
    name: MacOS
    needs: [precommit, standalone-generation, sanitizer-tests]
    uses: ./.github/workflows/macos.yml

  windows-tests:
    name: Windows
    needs: [precommit, standalone-generation, sanitizer-tests]
    uses: ./.github/workflows/windows.yml

  nvidia-tests:
    name: Nvidia
    needs: [precommit, standalone-generation, sanitizer-tests]
    uses: ./.github/workflows/nvidia.yml
